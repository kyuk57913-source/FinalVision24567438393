<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1118">
<title>Vision — Refresh app cache</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#080d13;color:#eef4f8;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,460px);padding:24px;border:1px solid #263746;border-radius:16px;background:#101923}h1{margin:0 0 8px;font-size:21px}p{margin:8px 0;color:#aebbc7}.note{margin:16px 0;padding:12px;border:1px solid #3d5367;border-radius:10px;background:#142130;color:#cfdae4;font-size:13px}button{width:100%;min-height:48px;margin-top:8px;border:0;border-radius:10px;background:#4c82d9;color:white;font:700 15px system-ui;cursor:pointer}#status{min-height:24px;margin-top:12px;color:#75e0ba;font-size:13px}
</style>
</head>
<body>
<main class="card">
  <h1>အဟောင်း cache ကိုရှင်းမယ်</h1>
  <p>Heatmap version အဟောင်းကို Chrome က cache ထဲက ပြနေသေးရင် ဒီခလုတ်ကိုနှိပ်ပြီး app ကိုပြန်ဖွင့်ပါ။</p>
  <div class="note">ဒီလုပ်ဆောင်ချက်က service worker/cache ကိုပဲရှင်းပါတယ်။ Trade records သိမ်းထားတဲ့ IndexedDB နဲ့ local storage ကို မဖျက်ပါ။</div>
  <button id="clear" type="button">Clear app cache</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
document.getElementById('clear').addEventListener('click',async function(){
  var status=document.getElementById('status');
  this.disabled=true;this.textContent='Clearing…';
  try{
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function(r){return r.unregister()}));
    }
    if(window.caches&&caches.keys){
      var keys=await caches.keys();
      await Promise.all(keys.filter(function(k){return k.indexOf('app-shell-')===0}).map(function(k){return caches.delete(k)}));
    }
    status.textContent='ပြီးပါပြီ။ ဒီစာမျက်နှာကိုပိတ်ပြီး app ကိုပြန်ဖွင့်ပါ၊ ပြီးရင် Reload လုပ်ပါ။';
    this.textContent='Cache cleared';
  }catch(e){
    status.textContent='Auto-clear မအောင်မြင်ပါ။ Chrome > Site settings > Clear data ကိုသုံးပါ။';
    this.disabled=false;this.textContent='Try again';
  }
});
</script>
</body>
</html>
